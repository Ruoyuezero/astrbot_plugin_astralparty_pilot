name: astrbot_plugin_astralparty_pilot
display_name: 星趴助手（Astral Party Pilot）
desc: "利用游戏资源解包数据 + 本地知识库 + 自动寻路决策算法，为《星引擎派对》（Astral Party）实现图鉴查询与对局辅助：查卡牌 / 怪物 / 角色 / 地块 / 地图 / 格子 / 筹码 / 成就，看立绘、战斗CG、表情包与地块圆片，算威胁排序、寻路与手牌建议，支持按 UID 查号；陪玩引擎（全自动代打、半自动代打、玩家自主操控三种模式）尚在开发中，未完全实装，请静待更新"
help: 发送 /app help 查看图鉴指令（card / map / land / buff / monster / hero / skin / cg / emoji / relic / achieve），发送 /app list 看图库各类素材张数，发送 /app <UID> 查别人，发送 /app in 扫码登录后 /app uid 看自己的完整档案卡、/app out 退出登录。注意：/appa 系列（陪玩 / 代打操控）尚在开发中，未完全实装，请静待更新。
version: 2.4.3
author: AstralPartyPilot
repo: "https://github.com/Ruoyuezero/astrbot_plugin_astralparty_pilot"
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 星引擎派对
  - 图鉴查询
  - 对局辅助
  - 游戏攻略
